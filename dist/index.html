<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0b1720"><meta name="description" content="BARREL BOUND 鋼塔救援：復古街機攀梯跳桶遊戲，手機與電腦即開即玩。"><title>BARREL BOUND｜鋼塔救援</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311242b'/%3E%3Ctext y='48' x='8' font-size='47'%3E🛢%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body><main id="cabinet" aria-label="鋼塔救援遊戲">
<canvas id="game" width="1080" height="1920" aria-label="攀梯跳桶遊戲場景"></canvas>
<header><div class="brand"><span class="mark">B<span>↗</span></span><div>BARREL BOUND<small>鋼 塔 救 援</small></div></div><div class="tools"><button id="sound" aria-label="切換聲音" title="聲音 M">♪</button><button id="pause" aria-label="暫停遊戲" title="暫停 P">Ⅱ</button><button id="fullscreen" aria-label="全螢幕" title="全螢幕">⛶</button></div></header>
<section class="hud" aria-label="遊戲資訊"><div><label>SCORE</label><strong id="score">000000</strong></div><div class="best"><label>BEST</label><strong id="best">000000</strong></div><div class="stage"><label>STAGE <b id="level">01</b></label><strong id="lives" aria-label="剩餘生命">♥ ♥ ♥</strong></div></section>
<div class="mission" id="mission"><i></i> 攀上鋼塔，救回你的機器人夥伴 <span>↑ TOP</span></div>
<div id="toast" role="status" aria-live="polite"></div>
<section class="overlay" id="overlay"><div class="intro-eyebrow" id="eyebrow"><span></span> A POCKET ARCADE ORIGINAL</div><h1 id="title">BARREL<br><em>BOUND</em><span>鋼 塔 救 援</span></h1><p id="message">一座鋼塔，一場冒險。<br>躍過滾桶，向頂端出發！</p><button class="primary" id="start">開始救援 <span>↗</span></button><div class="instructions" id="instructions"><span><b>← →</b> 移動</span><span><b>↑ ↓</b> 攀梯</span><span><b>SPACE</b> 跳躍</span></div><div class="intro-note" id="note">手機使用下方方向鍵與跳躍鍵</div></section>
<section class="controls" aria-label="觸控操作"><div class="pad"><button data-key="ArrowUp" class="up" aria-label="向上攀梯">▲</button><button data-key="ArrowLeft" class="left" aria-label="向左移動">◀</button><span class="pad-center">✦</span><button data-key="ArrowRight" class="right" aria-label="向右移動">▶</button><button data-key="ArrowDown" class="down" aria-label="向下攀梯">▼</button></div><div class="control-caption">MOVE / CLIMB</div><button data-key="Space" id="jump" aria-label="跳躍"><span>↟</span>JUMP</button><div class="jump-caption">跳躍 / 空白鍵</div></section>
<footer><span><i></i> <b id="status">READY TO PLAY</b></span><span>INSERT COURAGE · NO COINS NEEDED</span></footer>
</main><script src="game.js"></script></body></html>
